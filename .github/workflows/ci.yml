name: Quality Gate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: project_management_ci
          POSTGRES_USER: postgres
          # Disposable runner-local service: no reusable credentials in git.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d project_management_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Environment preflight
        run: npm run preflight:env
        env:
          JWT_SECRET: ci-jwt-secret-not-for-prod
          AI_CONFIG_ENCRYPTION_KEY: ci-ai-key-16chars

      - name: Lint API and web
        run: npm run lint

      - name: Backend integration and unit tests
        run: npm run test -w api

      - name: PostgreSQL schema and transaction integration
        working-directory: api
        run: node --test test/postgres-real-connection.test.js
        env:
          RUN_PG_INTEGRATION: "1"
          # Used only by this disposable service test; application tests stay SQLite-default.
          POSTGRES_TARGET_URL: postgresql://postgres@127.0.0.1:5432/project_management_ci

      - name: SQLite backup and restore drill
        run: npm run drill:sqlite-backup

      - name: Graceful shutdown drill
        run: npm run drill:graceful-shutdown

      - name: Initialize disposable migration verification database
        run: DATABASE_FILE="$RUNNER_TEMP/project-management.db" node -e "require('./api/db').initDb()"

      - name: Database integrity preflight
        run: DATABASE_FILE="$RUNNER_TEMP/project-management.db" npm run preflight:database -w api -- --json

      - name: Verify project-objective migration checksum and backfill
        run: DATABASE_FILE="$RUNNER_TEMP/project-management.db" npm run verify:project-objective-migration -w api

      - name: Export SQLite data for PostgreSQL rehearsal
        run: DATABASE_FILE="$RUNNER_TEMP/project-management.db" npm run export:postgres -w api -- --out "$RUNNER_TEMP/postgres-export"

      - name: Verify PostgreSQL export manifest
        run: npm run verify:postgres-export -w api -- --dir "$RUNNER_TEMP/postgres-export" --json

      - name: Build PostgreSQL reconciliation fixture
        run: node api/scripts/create-postgres-target-report-fixture.js --dir "$RUNNER_TEMP/postgres-export" --out "$RUNNER_TEMP/postgres-target-report.json"

      - name: Reconcile PostgreSQL import target report
        run: npm run reconcile:postgres-import -w api -- --dir "$RUNNER_TEMP/postgres-export" --target-report "$RUNNER_TEMP/postgres-target-report.json" --json

      - name: Frontend type check and unit tests
        run: npm run test -w web

      - name: Frontend production build
        run: npm run build -w web

      - name: Single-process production start smoke (static + readiness)
        run: npm run smoke:prod
        env:
          JWT_SECRET: ci-jwt-secret-not-for-prod
          AI_CONFIG_ENCRYPTION_KEY: ci-ai-key-16chars

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Isolated disposable-SQLite RC E2E (UI + roles + handoff)
        run: npm run test:rc-e2e
        env:
          CI: true
          JWT_SECRET: ci-jwt-secret-not-for-prod
          AI_CONFIG_ENCRYPTION_KEY: ci-ai-key-16chars
          PORT: 4010

      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD || test "$(git rev-list --count HEAD)" -eq 1
