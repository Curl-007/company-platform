name: Debug phase1 400

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reproduce admin ai-provider PATCH
        run: |
          cd api
          rm -f /tmp/dbg.db
          JWT_SECRET=ci-jwt-secret-not-for-prod AI_CONFIG_ENCRYPTION_KEY=ci-ai-key-16chars \
          DATABASE_FILE=/tmp/dbg.db SEED_DEMO_DATA=0 node -e '
            const { spawn } = require("node:child_process");
            const server = spawn(process.execPath, ["server.js"], {
              env: { ...process.env, PORT: "4199" },
              stdio: ["ignore", "pipe", "pipe"],
            });
            let out = "";
            server.stdout.on("data", (c) => { out += c; });
            server.stderr.on("data", (c) => { out += c; });
            const wait = async (ms) => new Promise((r) => setTimeout(r, ms));
            async function main() {
              for (let i = 0; i < 100; i++) {
                try {
                  const r = await fetch("http://127.0.0.1:4199/api/health");
                  if (r.ok) break;
                } catch {}
                await wait(200);
              }
              const login = await fetch("http://127.0.0.1:4199/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: "admin@example.com", password: "Admin@123" }),
              });
              const loginBody = await login.json();
              console.log("LOGIN", login.status, JSON.stringify(loginBody).slice(0, 200));
              if (!loginBody.data?.token) process.exit(2);
              const headers = { "Content-Type": "application/json", Authorization: `Bearer ${loginBody.data.token}` };
              const body = JSON.stringify({
                name: "Encrypted integration provider",
                provider: "openai-compatible",
                baseUrl: "https://api.example.test/v1",
                model: "test-model",
                apiKey: "sk-integration-secret-key",
              });
              const patch = await fetch("http://127.0.0.1:4199/api/admin/ai-provider", {
                method: "PATCH",
                headers,
                body,
              });
              console.log("PATCH_TEST_DOMAIN", patch.status, JSON.stringify(await patch.json()));
              const patch2 = await fetch("http://127.0.0.1:4199/api/admin/ai-provider", {
                method: "PATCH",
                headers,
                body: JSON.stringify({
                  name: "openai control",
                  provider: "openai-compatible",
                  baseUrl: "https://api.openai.com/v1",
                  model: "gpt-4o-mini",
                  apiKey: "sk-control-key",
                }),
              });
              console.log("PATCH_CONTROL", patch2.status, JSON.stringify(await patch2.json()));
              server.kill();
              process.exit(0);
            }
            main().catch((e) => { console.error("ERR", e); server.kill(); process.exit(1); });
          '
